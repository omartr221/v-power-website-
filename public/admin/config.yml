backend:
  name: git-gateway
  branch: main

locale: 'ar'

media_folder: "public/images"
public_folder: "/images"

collections:
  # ============ العربية ============
  - name: "ar_homepage"
    label: "عربي | 1- الرئيسية"
    files:
      - name: "home"
        label: "تعديل الصفحة الرئيسية"
        file: "content/ar/home.json"
        fields:
          - { label: "صورة الخلفية (رابط)", name: "heroImage", widget: "string" }
          - { label: "العنوان الرئيسي", name: "heroTitle", widget: "text" }
          - { label: "العلامات التجارية", name: "heroBrands", widget: "string" }
          - { label: "مقدمة الوصف", name: "heroDescriptionIntro", widget: "text" }
          - label: "أسطر الوصف"
            name: "heroDescriptionLines"
            widget: "list"
            field: { label: "سطر", name: "line", widget: "text" }
          - { label: "نص الزر الأول", name: "heroButton1", widget: "string" }
          - { label: "نص الزر الثاني", name: "heroButton2", widget: "string" }
          - { label: "عنوان قسم الخدمات", name: "servicesTitle", widget: "string" }
          - { label: "وصف قسم الخدمات", name: "servicesSubtitle", widget: "text" }
          - { label: "العلامات التجارية (قسم الخدمات)", name: "servicesBrands", widget: "string" }
          - label: "الخدمات المعروضة"
            name: "services"
            widget: "list"
            fields:
              - { label: "اسم الخدمة", name: "title", widget: "string" }
              - { label: "وصف مختصر", name: "desc", widget: "text" }
              - label: "نقاط تفصيلية (اختياري)"
                name: "bullets"
                widget: "list"
                required: false
                field: { label: "نقطة", name: "bullet", widget: "text" }

  - name: "ar_aboutpage"
    label: "عربي | 2- من نحن"
    files:
      - name: "about"
        label: "تعديل صفحة من نحن"
        file: "content/ar/about.json"
        fields:
          - { label: "عنوان الصفحة", name: "pageTitle", widget: "string" }
          - { label: "العنوان الفرعي", name: "pageSubtitle", widget: "string" }
          - { label: "عنوان القصة", name: "storyTitle", widget: "string" }
          - { label: "الفقرة الأولى", name: "storyParagraph1", widget: "text" }
          - { label: "الفقرة الثانية", name: "storyParagraph2", widget: "text" }
          - { label: "الفقرة الثالثة", name: "storyParagraph3", widget: "text" }
          - { label: "عنوان الرؤية", name: "visionTitle", widget: "string" }
          - { label: "نص الرؤية", name: "visionText", widget: "text" }
          - { label: "عنوان الرسالة", name: "missionTitle", widget: "string" }
          - { label: "نص الرسالة", name: "missionText", widget: "text" }
          - label: "القيم"
            name: "values"
            widget: "list"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الوصف", name: "desc", widget: "text" }
          - label: "الأقسام الإضافية"
            name: "extraSections"
            widget: "list"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - label: "نوع العرض"
                name: "layout"
                widget: "select"
                options: ["paragraphs", "bullets", "cta"]
              - { label: "تمهيد (اختياري)", name: "intro", widget: "text", required: false }
              - label: "العناصر"
                name: "items"
                widget: "list"
                field: { label: "عنصر", name: "item", widget: "text" }

  - name: "ar_contactinfo"
    label: "عربي | 3- التواصل"
    files:
      - name: "contact"
        label: "تعديل معلومات التواصل"
        file: "content/ar/contact.json"
        fields:
          - { label: "العنوان", name: "address", widget: "string" }
          - { label: "رابط خرائط جوجل", name: "mapsUrl", widget: "string" }
          - { label: "البريد الإلكتروني", name: "email", widget: "string" }
          - { label: "رقم الهاتف", name: "phone", widget: "string" }
          - { label: "رقم الواتساب", name: "whatsapp", widget: "string" }
          - { label: "ساعات العمل", name: "workingHours", widget: "string" }
          - { label: "رابط إنستغرام", name: "instagram", widget: "string" }
          - { label: "رابط فيسبوك", name: "facebook", widget: "string" }

  - name: "ar_services"
    label: "عربي | 4- الخدمات"
    folder: "content/ar/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم الخدمة", name: "title", widget: "string" }
      - { label: "وصف الخدمة", name: "description", widget: "text" }
      - { label: "رابط صورة الخدمة", name: "image", widget: "string" }
      - label: "المميزات"
        name: "features"
        widget: "list"
        field: { label: "ميزة", name: "feature", widget: "string" }

  # ============ English ============
  - name: "en_homepage"
    label: "English | 1- Home"
    files:
      - name: "home"
        label: "Edit home page"
        file: "content/en/home.json"
        fields:
          - { label: "Background image (URL)", name: "heroImage", widget: "string" }
          - { label: "Main heading", name: "heroTitle", widget: "text" }
          - { label: "Brands", name: "heroBrands", widget: "string" }
          - { label: "Description intro", name: "heroDescriptionIntro", widget: "text" }
          - label: "Description lines"
            name: "heroDescriptionLines"
            widget: "list"
            field: { label: "Line", name: "line", widget: "text" }
          - { label: "First button label", name: "heroButton1", widget: "string" }
          - { label: "Second button label", name: "heroButton2", widget: "string" }
          - { label: "Services section title", name: "servicesTitle", widget: "string" }
          - { label: "Services section description", name: "servicesSubtitle", widget: "text" }
          - { label: "Brands (services section)", name: "servicesBrands", widget: "string" }
          - label: "Listed services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service name", name: "title", widget: "string" }
              - { label: "Short description", name: "desc", widget: "text" }
              - label: "Detail bullets (optional)"
                name: "bullets"
                widget: "list"
                required: false
                field: { label: "Bullet", name: "bullet", widget: "text" }

  - name: "en_aboutpage"
    label: "English | 2- About"
    files:
      - name: "about"
        label: "Edit about page"
        file: "content/en/about.json"
        fields:
          - { label: "Page title", name: "pageTitle", widget: "string" }
          - { label: "Page subtitle", name: "pageSubtitle", widget: "string" }
          - { label: "Story title", name: "storyTitle", widget: "string" }
          - { label: "First paragraph", name: "storyParagraph1", widget: "text" }
          - { label: "Second paragraph", name: "storyParagraph2", widget: "text" }
          - { label: "Third paragraph", name: "storyParagraph3", widget: "text" }
          - { label: "Vision title", name: "visionTitle", widget: "string" }
          - { label: "Vision text", name: "visionText", widget: "text" }
          - { label: "Mission title", name: "missionTitle", widget: "string" }
          - { label: "Mission text", name: "missionText", widget: "text" }
          - label: "Values"
            name: "values"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Extra sections"
            name: "extraSections"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Layout"
                name: "layout"
                widget: "select"
                options: ["paragraphs", "bullets", "cta"]
              - { label: "Intro (optional)", name: "intro", widget: "text", required: false }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "text" }

  - name: "en_contactinfo"
    label: "English | 3- Contact"
    files:
      - name: "contact"
        label: "Edit contact details"
        file: "content/en/contact.json"
        fields:
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Google Maps link", name: "mapsUrl", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone number", name: "phone", widget: "string" }
          - { label: "WhatsApp number", name: "whatsapp", widget: "string" }
          - { label: "Working hours", name: "workingHours", widget: "string" }
          - { label: "Instagram link", name: "instagram", widget: "string" }
          - { label: "Facebook link", name: "facebook", widget: "string" }
